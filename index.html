<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover" />
  <meta name="theme-color" content="#ffffff" />
  <title>KG Material Catalogue | KG 材料图鉴</title>
  <link rel="stylesheet" href="css/styles.css" />
</head>
<body>
  <header class="site-header">
    <div class="shell header-inner">
      <div>
        <div class="eyebrow">CEILING & PARTITION · 天花与隔墙</div>
        <h1>KG Material Catalogue</h1>
        <p class="subtitle">材料图片目录 · English / 中文</p>
      </div>
      <a class="admin-link" href="admin.html" aria-label="Admin login">Admin</a>
    </div>
  </header>

  <main class="shell">
    <section class="toolbar card">
      <label class="search-wrap">
        <span>Search / 搜索</span>
        <input id="searchInput" type="search" placeholder="Name, size, colour / 名称、尺寸、颜色" autocomplete="off" />
      </label>
      <div class="toolbar-row">
        <label class="select-wrap">
          <span>Category / 分类</span>
          <select id="categorySelect">
            <option value="">All Categories / 全部分类</option>
          </select>
        </label>
        <label class="select-wrap">
          <span>Sort / 排序</span>
          <select id="sortSelect">
            <option value="custom">Default / 默认</option>
            <option value="name">Name A–Z / 名称</option>
            <option value="price_asc">Price Low–High / 价格低至高</option>
            <option value="price_desc">Price High–Low / 价格高至低</option>
          </select>
        </label>
      </div>
      <div id="categoryChips" class="chips" aria-label="Category filters"></div>
    </section>

    <section class="result-bar">
      <strong id="resultCount">0 items / 0 项</strong>
      <span id="statusText">Loading… / 载入中…</span>
    </section>

    <section id="catalogueGrid" class="catalogue-grid" aria-live="polite"></section>

    <section id="emptyState" class="empty-state card hidden">
      <div class="empty-icon">⌕</div>
      <h2>No matching item / 没有找到项目</h2>
      <p>Try another name, category, size or colour.<br/>可尝试其他名称、分类、尺寸或颜色。</p>
    </section>
  </main>

  <footer class="site-footer shell">
    <span>KG Material Catalogue · Public view only / 公开只读</span>
  </footer>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="js/config.js"></script>
  <script src="js/common.js"></script>
  <script src="js/catalog.js"></script>
</body>
</html>
